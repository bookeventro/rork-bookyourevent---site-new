<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookEvent.ro — lansare în curând</title>
  <meta name="description" content="BookEvent.ro se pregătește de lansare. Platformă pentru formații, DJ, fotografi, locații și servicii pentru evenimente." />
  <meta name="theme-color" content="#8b5cf6" />

  <style>
    :root{
      --bg:#0b0b0e;
      --panel:#121218;
      --text:#ececf3;
      --line:#242432;
      --gold:#c7a74a;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
        radial-gradient(1200px 700px at 70% -10%,#1b1530 0%,#0b0b0e 60%),
        #0b0b0e;
      color:var(--text);
      font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }

    .wrap{
      width:100%;
      max-width:1120px;
      padding:24px;
    }

    .topbar{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-bottom:16px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      text-decoration:none;
      color:#fff;
      border:1px solid var(--line);
      background:#1a1a22;
      padding:8px 12px;
      border-radius:12px;
      font-size:14px;
    }

    .hero{
      border:1px solid var(--line);
      background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.2));
      border-radius:32px;
      padding:40px 24px 46px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .logo-wrap{
      display:flex;
      justify-content:center;
      margin-bottom:18px;
    }

    .logo{
      height:160px;         /* aici controlezi MĂRIMEA logo-ului */
      width:auto;
      filter:drop-shadow(0 18px 40px rgba(139,92,246,.55));
      animation:fadeIn .9s ease both;
    }

    .badge-wrap{
      text-align:center;
    }

    .badge{
      display:inline-flex;
      gap:6px;
      align-items:center;
      font-size:14px;
      color:#111;
      background:linear-gradient(135deg,#f5e6a3,var(--gold));
      padding:8px 18px;
      border-radius:999px;
      border:1px solid #e6d38b;
      font-weight:700;
      box-shadow:0 10px 30px rgba(0,0,0,.45);
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(8px);}
      to{opacity:1;transform:none;}
    }

    @media (max-width:768px){
      .logo{ height:130px; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <a class="chip" href="mailto:bookevent.ro@gmail.com">✉️ Email</a>
      <a class="chip" href="https://wa.me/40755880688">💬 WhatsApp</a>
    </div>

    <header class="hero">
      <div class="logo-wrap">
        <!-- LOGO-ul tău din root (schimbă numele fișierului dacă este altul) -->
        <img class="logo" src="logo.png" alt="BookEvent.ro">
      </div>

      <div class="badge-wrap">
        <span class="badge">Lansare în curând · acces anticipat</span>
      </div>
    </header>

  </div>
</body>
</html>
